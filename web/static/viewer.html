<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>WrenchAtlas · 查看</title>
<style>
  :root{
    --bg:#15171b; --panel:#1d2026; --line:#2f343d;
    --txt:#e9e7e3; --dim:#9aa0aa; --dim2:#6f7681; --accent:#e8a33d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{position:fixed;top:0;left:0;right:0;height:52px;z-index:20;display:flex;
    align-items:center;gap:10px;padding:0 12px;background:rgba(29,32,38,.96);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header a{color:var(--dim);text-decoration:none;font-size:20px;line-height:1;
    padding:8px 10px;border-radius:8px}
  header a:active{background:var(--panel)}
  .title{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .title em{font-style:normal;color:var(--dim2);font-size:12px;margin-left:6px}
  .zbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    width:34px;height:34px;border-radius:8px;font-size:17px;cursor:pointer;flex:0 0 auto}
  .zbtn:active{border-color:var(--accent);color:var(--accent)}
  #zoomVal{font-size:11.5px;color:var(--dim2);min-width:40px;text-align:center;flex:0 0 auto}

  #viewport{position:fixed;top:52px;left:0;right:0;bottom:0;overflow:hidden;
    background:#0f1114;touch-action:none;cursor:crosshair}
  #stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #base{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
  #hl{position:absolute;display:none;pointer-events:none;image-rendering:pixelated}

  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:20;
    background:rgba(29,32,38,.95);border:1px solid var(--line);border-radius:10px;
    padding:9px 15px;font-size:12.5px;color:var(--dim);max-width:calc(100vw - 32px);
    text-align:center;transition:opacity .25s}
  #hint.busy{color:var(--accent);border-color:var(--accent)}
  #hint.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<header>
  <a href="/" data-pack title="返回列表">←</a>
  <div class="title" id="title">加载中…</div>
  <button class="zbtn" id="zoomOut">−</button>
  <span id="zoomVal">100%</span>
  <button class="zbtn" id="zoomIn">+</button>
  <button class="zbtn" id="fit" title="适应窗口">⤢</button>
</header>

<div id="viewport">
  <div id="stage">
    <img id="base" alt="">
    <img id="hl" alt="">
  </div>
</div>
<div id="hint">点任意一条线，自动高亮整块</div>

<script src="/static/packbar.js"></script>
<script>const PAGE = new URLSearchParams(location.search).get("p") || "";
const base = document.getElementById("base");
const hl   = document.getElementById("hl");
const vp   = document.getElementById("viewport");
const stage= document.getElementById("stage");
const hint = document.getElementById("hint");
const zVal = document.getElementById("zoomVal");

let W = 0, H = 0, s = 1, tx = 0, ty = 0;
let reqToken = 0, hasHighlight = false;

function apply(){
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  zVal.textContent = Math.round(s * 100) + "%";
}

function fit(){
  if(!W) return;
  const vw = vp.clientWidth, vh = vp.clientHeight;
  s = Math.min(vw / W, 1);
  tx = (vw - W * s) / 2;
  ty = 0;
  apply();
}

function zoomAt(cx, cy, factor){
  const ns = Math.min(4, Math.max(0.05, s * factor));
  const ix = (cx - tx) / s, iy = (cy - ty) / s;
  s = ns;
  tx = cx - ix * s;
  ty = cy - iy * s;
  apply();
}

function say(msg, busy){
  hint.textContent = msg;
  hint.classList.remove("hide");
  hint.classList.toggle("busy", !!busy);
}

async function traceAt(ix, iy){
  const token = ++reqToken;
  say("分析中…", true);
  try{
    const url = WA.withPack(`/api/trace?page=${encodeURIComponent(PAGE)}&x=${Math.round(ix)}&y=${Math.round(iy)}`);
    const d = await (await fetch(url)).json();
    if(token !== reqToken) return;
    if(!d.found || !d.mask){
      hl.style.display = "none"; hasHighlight = false;
      say("这里没有线条，再点准一点", false);
      setTimeout(() => hint.classList.add("hide"), 1600);
      return;
    }
    const [x1,y1,x2,y2] = d.bbox;
    hl.src = d.mask;
    hl.style.left = x1 + "px";
    hl.style.top = y1 + "px";
    hl.style.width = (x2 - x1) + "px";
    hl.style.height = (y2 - y1) + "px";
    hl.style.display = "block";
    hasHighlight = true;
    const n = d.segments || 1;
    say(n > 1 ? `已高亮这条线（${n} 段）· 再点别处切换` : "已高亮这条线 · 再点别处切换", false);
    setTimeout(() => hint.classList.add("hide"), 2400);
  }catch(e){
    if(token === reqToken) say("分析失败：" + e.message, false);
  }
}

/* ---------- 指针交互：拖拽 / 双指缩放 / 点击 ---------- */
const ptrs = new Map();
let start = null, moved = 0, pinch = null;

vp.addEventListener("pointerdown", e => {
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(ptrs.size === 1){
    start = {x: e.clientX, y: e.clientY, tx, ty};
    moved = 0;
  } else if(ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    pinch = {
      d: Math.hypot(a.x-b.x, a.y-b.y),
      s, tx, ty,
      cx: (a.x+b.x)/2, cy: (a.y+b.y)/2
    };
    start = null;
  }
});

vp.addEventListener("pointermove", e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if(ptrs.size === 2 && pinch){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const rect = vp.getBoundingClientRect();
    const cx = (a.x+b.x)/2 - rect.left, cy = (a.y+b.y)/2 - rect.top;
    const ratio = Math.min(4, Math.max(0.05, pinch.s * (d / pinch.d))) / pinch.s;
    const ix = ((pinch.cx - rect.left) - pinch.tx) / pinch.s;
    const iy = ((pinch.cy - rect.top) - pinch.ty) / pinch.s;
    s = pinch.s * ratio;
    tx = cx - ix * s;
    ty = cy - iy * s;
    apply();
    return;
  }

  if(start){
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    moved = Math.max(moved, Math.hypot(dx, dy));
    tx = start.tx + dx;
    ty = start.ty + dy;
    apply();
  }
});

function endPointer(e){
  const wasSingle = ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if(ptrs.size < 2) pinch = null;

  if(start && wasSingle && moved < 7){
    const rect = vp.getBoundingClientRect();
    const ix = (e.clientX - rect.left - tx) / s;
    const iy = (e.clientY - rect.top - ty) / s;
    if(ix >= 0 && iy >= 0 && ix < W && iy < H) traceAt(ix, iy);
  }
  if(ptrs.size === 0) start = null;
}
vp.addEventListener("pointerup", endPointer);
vp.addEventListener("pointercancel", endPointer);

vp.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = vp.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive: false});

document.getElementById("zoomIn").onclick  = () => zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1.3);
document.getElementById("zoomOut").onclick = () => zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1/1.3);
document.getElementById("fit").onclick     = fit;
window.addEventListener("resize", () => { if(s === 0) fit(); });

/* ---------- 载入 ---------- */
fetch(WA.withPack("/api/pages")).then(r => r.json()).then(d => {
  const p = d.pages.find(x => x.image.split("/").pop() === PAGE);
  document.getElementById("title").innerHTML =
    `${p ? p.title : PAGE}<em>${p ? "p" + p.page : ""}</em>`;
  document.title = (p ? p.title : "查看") + " · WrenchAtlas";
});

base.onload = () => {
  W = base.naturalWidth; H = base.naturalHeight;
  stage.style.width = W + "px";
  stage.style.height = H + "px";
  fit();
};
base.src = WA.withPack("/media/pages/" + encodeURIComponent(PAGE));
// 页图不在仓库里（版权原因），没生成过就会 404 —— 给人一句人话，别让他对着破图猜
base.onerror = () => {
  const vp = document.getElementById("viewport");
  vp.innerHTML = `<div style="padding:40px 24px;max-width:520px;margin:0 auto;
    font-size:13px;line-height:1.9;color:var(--dim)">
    <p style="font-size:15px;color:var(--fg);margin-bottom:12px">这一页的图还没生成</p>
    <p>页面索引在，但页图文件不在。仓库出于版权原因不含手册图片。</p>
    <p style="margin-top:14px;color:var(--dim2)">生成方法（需要你自己合法持有的手册）：</p>
    <pre style="background:#15171b;border:1px solid var(--line);border-radius:8px;
      padding:12px;overflow-x:auto;font-size:12px">python builder/enhance.py \\
  --src "你的手册目录" \\
  --out packs/&lt;车型id&gt;/pages</pre>
    <p style="margin-top:14px"><a href="/" style="color:var(--accent)">← 返回列表</a></p>
    </div>`;
};
</script>
</body>
</html>
