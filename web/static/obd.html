<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBD 报告 · WrenchAtlas</title>
<style>
  :root{
    --bg:#15171b; --panel:#1d2026; --panel2:#242830; --line:#2f343d;
    --txt:#e9e7e3; --dim:#9aa0aa; --dim2:#6f7681; --accent:#e8a33d;
    --ok:#5DCAA5; --warn:#EF9F27; --bad:#e06c5f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(29,32,38,.96);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header a{color:var(--dim);text-decoration:none;font-size:20px;padding:4px 8px;border-radius:8px}
  header h1{margin:0;font-size:15px;font-weight:600;flex:1}
  header h1 em{font-style:normal;font-size:12px;color:var(--dim2);margin-left:8px;font-weight:400}
  #packbar{display:flex}
  main{padding:16px 14px 60px;max-width:860px;margin:0 auto}
  .note{border:1px solid #4a3d1e;background:#241f12;border-radius:12px;
    padding:12px 14px;font-size:12.5px;color:#d8c187;line-height:1.7;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px}
  .card h3{margin:0 0 8px;font-size:14.5px;font-weight:500}
  .card h3 .tag{font-size:11px;color:var(--dim2);font-weight:400;margin-left:6px}
  textarea{width:100%;min-height:120px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;color:var(--txt);font:12px/1.5 ui-monospace,Consolas,monospace;
    padding:10px;resize:vertical}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--accent);
    border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;margin:6px 6px 0 0}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:6px 4px;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right;color:var(--dim)}
  tr:last-child td{border-bottom:none}
  .kv{font-size:12.5px;color:var(--dim);line-height:1.8;margin:0}
  .kv b{color:var(--txt);font-weight:500}
  .src{display:inline-block;font-size:10.5px;color:#7fae9d;border:1px solid #2f4a41;
    border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:1px}
  .dtc{font-size:12.5px;margin:4px 0}
  .dtc .none{color:var(--ok)}
  .dtc .code{color:var(--warn);font-family:ui-monospace,Consolas,monospace}
  details{margin-top:8px;font-size:12px;color:var(--dim)}
  details summary{cursor:pointer;color:var(--dim2)}
  details pre{background:#15171b;border:1px solid var(--line);border-radius:8px;
    padding:10px;font-size:11px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .sess{cursor:pointer}
  .sess:hover{border-color:var(--accent)}
  .sess h4{margin:0;font-size:13.5px;font-weight:500}
  .sess .meta{font-size:11.5px;color:var(--dim2);margin-top:3px}
  .badge{display:inline-block;font-size:10.5px;border-radius:6px;padding:1px 7px;margin-left:6px}
  .badge.ok{color:var(--ok);border:1px solid #2f4a41}
  .badge.partial{color:var(--warn);border:1px solid #4a3d1e}
  .pill{font-size:11px;color:var(--dim2)}
  .err{color:var(--bad);font-size:12.5px;margin-top:8px;white-space:pre-wrap}
  .empty{color:var(--dim2);font-size:12.5px;padding:8px 0}
</style>
</head>
<body>
<header>
  <a href="/" data-pack>←</a>
  <h1>OBD 报告导入<em>第一阶段 · 报告解析展示</em></h1>
  <div id="packbar"></div>
</header>
<main>
  <div class="note">
    <b>能力边界（先读这个）：</b>这里展示的是<b>标准 OBD 的发动机／排放层数据</b>（Mode 01/02/03/07/09/0A 只读）。
    它<b>不是全车模块扫描</b>——ABS、气囊（SRS）、车身（BCM）、四驱等厂家专用模块不在标准 OBD 范围内，
    本页也不会把它们显示为「已检测」或「正常」。
    每个数值的来源都是<b style="color:#7fae9d">实车 OBD 观测</b>：它只说明「那一次采样时读到了什么」，
    不构成维修结论，也不能与手册电路判据混用。
  </div>

  <div class="card">
    <h3>导入采集报告 <span class="tag">wrenchatlas.obd_probe.v1（Android 工具导出的 JSON）</span></h3>
    <input type="file" id="file" accept=".json,application/json" style="display:none">
    <button id="btnFile">选择 JSON 文件…</button>
    <button id="btnDemo">载入合成测试样本</button>
    <textarea id="paste" placeholder="也可以把报告 JSON 直接粘贴到这里…"></textarea>
    <button id="btnImport" disabled>导入</button>
    <div class="err" id="impErr"></div>
  </div>

  <div class="card">
    <h3>已导入会话</h3>
    <div id="sessions"><div class="empty">加载中…</div></div>
  </div>

  <div id="detail"></div>
</main>
<script src="/static/packbar.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  let rawText='';
  WA.bindLinks && WA.bindLinks(document);

  $('file').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{ $('paste').value=rd.result; sync(); };
    rd.readAsText(f,'utf-8');
  };
  $('btnFile').onclick=()=>$('file').click();
  $('btnDemo').onclick=async()=>{
    const r=await fetch('/static/obd-demo.json');
    $('paste').value=await r.text(); sync();
  };
  $('paste').oninput=sync;
  function sync(){ rawText=$('paste').value.trim(); $('btnImport').disabled=!rawText; }

  $('btnImport').onclick=async()=>{
    $('impErr').textContent='';
    let report;
    try{ report=JSON.parse(rawText); }
    catch(e){ $('impErr').textContent='JSON 解析失败：'+e.message; return; }
    try{
      const r=await fetch('/api/obd/import?pack='+encodeURIComponent(WA.pack()),{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({report})});
      const d=await r.json();
      if(!r.ok){ $('impErr').textContent=d.detail||('导入失败 '+r.status); return; }
      $('paste').value=''; sync();
      loadSessions(); openSession(d.sid);
    }catch(e){ $('impErr').textContent=''+e; }
  };

  const SRC='<span class="src">实车 OBD 观测</span>';

  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  async function loadSessions(){
    const el=$('sessions');
    try{
      const r=await fetch('/api/obd/sessions?pack='+encodeURIComponent(WA.pack()));
      const d=await r.json();
      if(!d.sessions.length){ el.innerHTML='<div class="empty">还没有导入过报告。</div>'; return; }
      el.innerHTML=d.sessions.map(s=>
        '<div class="card sess" data-sid="'+esc(s.sid)+'"><h4>'+esc(s.exported_at||s.sid)+
        '<span class="badge '+(s.status==='complete'?'ok':'partial')+'">'+esc(s.status||'?')+'</span></h4>'+
        '<div class="meta">'+esc(s.adapter||'?')+' · '+esc(s.protocol||'协议未知')+' · '+
        'ECU: '+esc((s.ecus||[]).join(' / ')||'无')+' · '+s.queries+' 条请求</div></div>').join('');
      el.querySelectorAll('.sess').forEach(x=>x.onclick=()=>openSession(x.dataset.sid));
    }catch(e){ el.innerHTML='<div class="empty">加载失败：'+esc(e)+'</div>'; }
  }

  async function openSession(sid){
    location.hash = 's=' + encodeURIComponent(sid);
    const host=$('detail');
    host.innerHTML='<div class="card"><div class="empty">解析中…</div></div>';
    let p;
    try{
      const r=await fetch('/api/obd/sessions/'+encodeURIComponent(sid)+'?pack='+encodeURIComponent(WA.pack()));
      if(!r.ok){ host.innerHTML='<div class="card"><div class="err">读取失败 '+r.status+'</div></div>'; return; }
      p=await r.json();
    }catch(e){ host.innerHTML='<div class="card"><div class="err">'+esc(e)+'</div></div>'; return; }

    const a=p.adapter||{}, c=p.capture||{};
    let html='<div class="card"><h3>会话 '+esc(p.exported_at||sid)+'</h3>'+
      '<p class="kv">适配器：<b>'+esc(a.name||'?')+'</b>（'+esc(a.address||'?')+'）· '+esc(a.transport||'?')+
      '　协议：<b>'+esc((a.protocol||'未知').trim())+'</b>'+
      '　适配器电压：<b>'+esc(volt(a.voltage))+'</b></p>'+
      '<p class="kv">采集状态：<b>'+esc(c.status||'?')+'</b>　发送/接收通道：'+
      '<b>'+esc(shortUuid(a.write_uuid))+' → '+esc(shortUuid(a.notify_uuid))+'</b>'+
      (c.skipped&&c.skipped.length?'　<span class="pill">因时间预算未采集 '+c.skipped.length+' 项</span>':'')+'</p>'+
      '<p class="kv">'+esc(p.scope_note||'')+'</p></div>';

    for(const [cid,e] of Object.entries(p.ecus||{})){
      html+='<div class="card"><h3>ECU '+esc(cid)+SRC+'</h3>';
      const live=Object.entries(e.live||{});
      if(live.length){
        html+='<table>'+live.map(([k,v])=>
          '<tr><td>'+esc(k)+'<span class="pill"> (PID '+esc(v.pid)+')</span></td><td>'+
          esc(fmtVal(v.value))+' '+esc(v.unit||'')+'</td></tr>').join('')+'</table>';
      }else html+='<div class="empty">该 ECU 没有可解码的实时参数。</div>';
      html+='<div class="dtc">确认故障码：'+(e.dtc_confirmed.length?
        e.dtc_confirmed.map(x=>'<span class="code">'+esc(x)+'</span>').join(' '):'<span class="none">无（响应全零）</span>')+
        '　待定：'+(e.dtc_pending.length?e.dtc_pending.map(x=>'<span class="code">'+esc(x)+'</span>').join(' '):'<span class="none">无</span>')+
        '　永久：'+(e.dtc_permanent.length?e.dtc_permanent.map(x=>'<span class="code">'+esc(x)+'</span>').join(' '):'<span class="none">无</span>')+'</div>';
      const idt=Object.entries(e.identity||{});
      if(idt.length) html+='<p class="kv">身份：'+idt.map(([k,v])=>k+'=<b>'+esc(fmtVal(v.value))+'</b>').join(' · ')+'</p>';
      if(e.unparsed&&e.unparsed.length) html+='<details><summary>未能安全解码的原始报文（'+e.unparsed.length+' 条）</summary><pre>'+
        esc(e.unparsed.map(u=>u.request+'  '+(u.raw||(u.raw_only?('重组不完整 '+u.got+'/'+u.need+' 字节'):''))).join('\n'))+'</pre></details>';
      html+='</div>';
    }

    const nr=p.no_response_queries||[];
    if(nr.length) html+='<div class="card"><h3>无响应 / 不支持的请求 <span class="tag">保持原样，不当作 0</span></h3><p class="kv">'+
      nr.map(x=>esc(x.request)+'（'+esc(x.status)+'）').join(' · ')+'</p></div>';

    html+='<div class="card"><h3>与问诊/电路的关系 <span class="tag">不同来源，不能混用</span></h3><p class="kv">'+
      '本页数值是<b>实车 OBD 观测</b>；问诊页的判据是<b>手册电路</b>与<b>推断</b>。'+
      '例如「水温 78℃」只说明采样时读数，不证明「节温器正常」；「控制模块电压 14.3V」'+
      '也只是当时充电侧的观测值，判断充电系统仍要走<a data-pack href="/symptom">问诊</a>的验证步骤。</p></div>';

    host.innerHTML=html;
    WA.bindLinks && WA.bindLinks(host);
    host.scrollIntoView({behavior:'smooth'});
  }

  function volt(s){ if(!s)return'?'; const m=String(s).match(/([\d.]+)V?/i); return m?m[1]+' V':s; }
  function shortUuid(u){ return u?String(u).replace(/^0000/,'').replace(/-0000-1000-8000-00805f9b34fb$/,'').toUpperCase():'?'; }
  function fmtVal(v){ return Array.isArray(v)?v.join(' '):v; }

  /* 深链：#s=<sid> 直接打开某次会话，也便于分享与自动化验收 */
  const hashSid = new URLSearchParams(location.hash.replace(/^#/, '')).get('s');
  if (hashSid) openSession(hashSid); else loadSessions();
})();
</script>
</body>
</html>
